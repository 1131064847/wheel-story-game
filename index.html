<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a1428" />
  <title>转盘故事 · STORY WHEEL</title>
  <link rel="stylesheet" href="css/play.css?v=20260905c" />
  <script src="js/core/Config.js?v=20260905c"></script>
  <script src="js/core/Storage.js?v=20260905c"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      background: var(--page-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
    }
    .home-card {
      text-align: center;
      padding: 40px 28px;
      max-width: 320px;
      width: calc(100% - 48px);
    }
    .home-logo {
      width: 84px;
      height: 84px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 2px solid var(--modal-border);
      background: var(--modal-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: var(--wheel-shadow);
    }
    .home-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--text-title);
      margin: 0 0 8px;
    }
    .home-sub {
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--text-hint);
      margin-bottom: 34px;
    }
    .home-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 54px;
      border-radius: 27px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 2px;
      font-family: inherit;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.15s, opacity 0.2s;
    }
    .home-btn:active { transform: scale(0.96); }
    .home-btn-primary {
      border: none;
      color: var(--btn-solid-text);
      background: var(--btn-solid-bg);
      box-shadow: var(--btn-solid-shadow);
      margin-bottom: 14px;
    }
    .home-btn-secondary {
      border: 1px solid var(--fab-border);
      background: transparent;
      color: var(--text-hint);
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="home-card">
    <div class="home-logo">♜</div>
    <h1 class="home-title">转盘故事</h1>
    <div class="home-sub">STORY · WHEEL</div>
    <button class="home-btn home-btn-primary" id="startBtn">▶ 开始游戏</button>
    <button class="home-btn home-btn-secondary" id="adminEntryBtn">⚙ 管理员入口</button>
  </div>

  <script>
    (function () {
      'use strict';

      document.getElementById('startBtn').addEventListener('click', function () {
        // 时间戳防缓存，确保进入的总是最新游玩页
        location.href = 'play.html?_=' + Date.now();
      });

      document.getElementById('adminEntryBtn').addEventListener('click', function () {
        // 已登录管理员直接进后台，否则前往独立登录页
        var loggedIn = false;
        try {
          var s = Storage.get(CONFIG.STORAGE_KEYS.ADMIN_SESSION);
          loggedIn = !!(s && s.loggedIn);
        } catch (e) {}
        location.href = loggedIn ? 'admin-dashboard.html' : 'admin-login.html';
      });
    })();
  </script>

</body>
</html>
