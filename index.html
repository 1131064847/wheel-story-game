  <script src="js/core/Config.js"></script>
  <script src="js/core/Storage.js"></script>
  <script>
    (function () {
      try {
        const s = Storage.get(CONFIG.STORAGE_KEYS.ADMIN_SESSION);
        if (s && s.loggedIn) {
          location.replace('admin-dashboard.html');
          return;
        }
      } catch (e) {}
      location.replace('play.html');
    })();
  </script>
