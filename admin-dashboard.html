<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <title>管理后台 · 故事节点配置</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-body">

<header class="admin-header">
  <div class="admin-header-title">⚙ 故事节点管理 <span class="dot">·</span> <span id="headerStatus"></span></div>
  <div class="admin-header-right">
    <button class="admin-btn" id="playDemoBtn">▶ 游玩预览</button>
    <button class="admin-btn admin-btn-danger" id="logoutBtn">退出登录</button>
  </div>
</header>

<main class="admin-main">

  <!-- Left: Node list -->
  <section>
    <div class="panel">
      <h3>节点列表 <span class="sub" id="nodeCount">0 个</span></h3>
      <div style="display:flex;gap:6px;margin-bottom:10px">
        <button class="admin-btn admin-btn-primary" style="flex:1" id="addNodeBtn">+ 新增节点</button>
        <button class="admin-btn" id="resetDefaultBtn">恢复默认</button>
      </div>
      <div class="node-list" id="nodeList"></div>
    </div>

    <div class="panel">
      <h3>导入 / 导出</h3>
      <div class="io-row">
        <button class="admin-btn" id="exportBtn">⬇ 导出 JSON</button>
        <button class="admin-btn" id="importBtn">⬆ 导入 JSON</button>
        <input type="file" id="importFile" accept=".json,application/json" style="display:none" />
      </div>
      <div style="font-size:11px;color:#94a3b8;margin-top:8px">所有配置数据存储在浏览器 localStorage</div>
    </div>

    <div class="panel">
      <h3>配置校验</h3>
      <div id="validationBox"></div>
      <button class="admin-btn admin-btn-sm" id="validateBtn" style="margin-top:8px">重新校验</button>
    </div>
  </section>

  <!-- Right: Node editor + sector + preview -->
  <section>
    <div class="panel">
      <h3 id="editorTitle">节点编辑</h3>
      <div id="emptyHint" class="empty-state">
        <div class="icon">📝</div>
        请从左侧选择一个节点进行编辑<br/>
        或点击「新增节点」创建新故事节点
      </div>

      <div id="editorForm" class="hidden">
        <div class="form-grid">
          <div class="form-item">
            <label>节点 ID（唯一标识）</label>
            <input type="text" id="f_id" placeholder="如 hall_01" />
          </div>
          <div class="form-item checkbox">
            <input type="checkbox" id="f_isEnding" />
            <label style="margin:0">结局节点（无转盘，仅展示文案）</label>
          </div>
          <div class="form-item full">
            <label>标题</label>
            <input type="text" id="f_title" placeholder="如 第一章：诡异大厅" />
          </div>
          <div class="form-item full">
            <label>剧情文本（支持换行）</label>
            <textarea id="f_content" placeholder="在此输入该节点展示给玩家的剧情..."></textarea>
          </div>
        </div>

        <div style="display:flex;gap:8px;margin-top:14px">
          <button class="admin-btn admin-btn-primary" id="saveNodeBtn">💾 保存节点</button>
          <button class="admin-btn admin-btn-danger" id="deleteNodeBtn">🗑 删除节点</button>
          <button class="admin-btn" id="setRootBtn">📌 设为根节点</button>
        </div>
      </div>
    </div>

    <div class="panel" id="sectorPanel">
      <h3>转盘扇区配置 <span class="sub" id="sectorSubLabel"></span></h3>
      <div class="preview-wrap">
        <canvas id="previewCanvas" width="200" height="200"></canvas>
        <div style="flex:1">
          <div id="previewInfo" style="font-size:12px;color:#64748b;margin-bottom:10px"></div>
          <button class="admin-btn admin-btn-sm" id="trySpinBtn">试转一次</button>
        </div>
      </div>
      <div id="sectorsWrap" style="margin-top:12px">
        <table class="sectors-table">
          <thead>
            <tr>
              <th style="width:28%">文字</th>
              <th style="width:14%">角度(°)</th>
              <th style="width:14%">颜色</th>
              <th style="width:28%">跳转目标节点</th>
              <th style="width:8%"></th>
            </tr>
          </thead>
          <tbody id="sectorsBody"></tbody>
        </table>
      </div>
      <div class="angle-summary">
        <span>角度总和：<b id="angleTotal">0</b>°</span>
        <button class="admin-btn admin-btn-sm" id="addSectorBtn">+ 添加扇区</button>
      </div>
    </div>
  </section>

</main>

<div class="admin-toast" id="toast"></div>

<!-- Confirm modal -->
<div id="modalMask" class="modal-mask hidden">
  <div class="modal-box">
    <h4 id="modalTitle">确认</h4>
    <p id="modalBody"></p>
    <div class="modal-actions">
      <button class="admin-btn" id="modalCancel">取消</button>
      <button class="admin-btn admin-btn-danger" id="modalOk">确认</button>
    </div>
  </div>
</div>

<script src="js/core/Config.js"></script>
<script src="js/core/Utils.js"></script>
<script src="js/core/Storage.js"></script>
<script src="js/components/Wheel.js"></script>
<script src="js/engine/StoryEngine.js"></script>
<script src="js/admin/Auth.js"></script>
<script src="js/admin/AdminApp.js"></script>

</body>
</html>
