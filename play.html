<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <meta name="theme-color" content="#1a1428" />
  <title>古堡迷踪 · 转盘故事</title>
  <link rel="stylesheet" href="css/play.css?v=20260905d" />
</head>
<body>

<div class="page" id="app">

  <!-- 左侧主题侧边栏（默认收起，点击把手向右滑出） -->
  <div class="drawer-mask" id="drawerMask" style="display:none"></div>
  <div class="side-drawer" id="themeDrawer">
    <div class="side-drawer-title">🎨 主题切换</div>
    <div class="side-drawer-row">
      <button class="theme-opt" id="themeLightBtn" aria-label="切换白昼主题">
        <span class="theme-opt-dot theme-dot-light"></span>
        <span class="theme-opt-label">白昼</span>
      </button>
      <button class="theme-opt" id="themeDarkBtn" aria-label="切换暗夜主题">
        <span class="theme-opt-dot theme-dot-dark"></span>
        <span class="theme-opt-label">暗夜</span>
      </button>
    </div>
    <div class="side-drawer-hint">点击即可切换主题</div>
  </div>
  <button class="sidebar-handle" id="sidebarHandle" aria-label="打开主题切换栏">›</button>

  <!-- 右下角管理员入口小圆点 -->
  <button class="admin-fab" id="adminFab" aria-label="管理员入口">⚙</button>

  <!-- 逆天改命：回退上一节点重新指定选择 -->
  <div class="modal-mask" id="fateModal" style="display:none">
    <div class="modal-card">
      <div class="modal-title">逆天改命 · 重新抉择</div>
      <div class="fate-subtitle" id="fateSubtitle"></div>
      <div class="fate-list" id="fateList"></div>
      <div class="modal-btns">
        <button class="modal-btn modal-btn-cancel" id="fateCancelBtn">取消</button>
      </div>
    </div>
  </div>

  <!-- 管理员登录弹窗（重新设计：输入框默认空，手动填入） -->
  <div class="modal-mask" id="adminModal" style="display:none">
    <div class="modal-card login-card">
      <button class="modal-close" id="adminCancelBtn" aria-label="关闭">✕</button>
      <div class="login-logo">♜</div>
      <div class="modal-title">管理员登录</div>
      <div class="modal-subtitle">CASTLE KEEPER · 仅限授权管理员</div>
      <div class="login-field">
        <span class="login-field-icon">👤</span>
        <input class="modal-input login-input" id="adminUserInput" type="text" placeholder="请输入账号" autocomplete="off" />
      </div>
      <div class="login-field">
        <span class="login-field-icon">🔑</span>
        <input class="modal-input login-input" id="adminPassInput" type="password" placeholder="请输入密码" autocomplete="off" />
      </div>
      <div class="modal-error" id="adminError"></div>
      <button class="modal-btn modal-btn-confirm login-btn" id="adminLoginBtn">进入后台 →</button>
    </div>
  </div>

  <div class="nav-bar">
    <button class="nav-bgm" id="bgmBtn" aria-label="关闭背景音乐">
      <span class="bgm-note">♪</span>
    </button>
    <button class="nav-home" id="homeBtn">⌂ 主页</button>
    <div class="nav-title">STORY · WHEEL</div>
    <button class="nav-restart" id="restartBtn">↻ 重新开始</button>
  </div>

  <div class="story-card" id="storyCard">
    <div class="story-title" id="storyTitle">加载中...</div>
    <div class="story-content" id="storyContent">请稍候，故事即将展开...</div>
  </div>

  <div class="wheel-section" id="wheelSection">
    <div class="wheel-wrap">
      <canvas id="wheelCanvas" width="320" height="320"></canvas>
    </div>
    <div class="selection-toast" id="selectionToast"></div>
    <div class="spin-btn-wrap">
      <button class="spin-btn" id="spinBtn">转 动</button>
      <button class="fate-btn" id="fateBtn">逆天改命</button>
    </div>
  </div>

  <div class="ending-btn-wrap" id="endingBtnWrap" style="display:none">
    <button class="ending-btn" id="endingRestartBtn">↻ 重新开始冒险</button>
  </div>

  <!-- 底部历史剧情区（默认收起） -->
  <div class="history-section" id="historySection">
    <div class="history-header">
      <span class="history-title">📜 历史剧情</span>
      <button class="history-toggle" id="historyToggleBtn">展开</button>
    </div>
    <div class="history-list" id="historyList" style="display:none"></div>
  </div>

</div>

<script src="js/core/Config.js?v=20260905d"></script>
<script src="js/core/Utils.js?v=20260905d"></script>
<script src="js/core/Storage.js?v=20260905d"></script>
<script src="js/core/AudioFX.js?v=20260905d"></script>
<script src="js/admin/Auth.js?v=20260905d"></script>
<script src="js/components/Wheel.js?v=20260905d"></script>
<script src="js/engine/StoryEngine.js?v=20260905d"></script>
<script src="js/play/Theme.js?v=20260905d"></script>
<script src="js/play/AdminEntry.js?v=20260905d"></script>
<script src="js/play/PlayApp.js?v=20260905d"></script>

</body>
</html>
